<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <title>Constructor — Juegos en Familia</title>
  <link rel="stylesheet" href="../shared/family-game.css" />
  <style>
    body { background: var(--fg-bg); min-height: 100svh; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── CANVAS ── */
    #canvas-wrap {
      background: linear-gradient(160deg,#e0f2fe,#bae6fd);
      border-radius: 18px; overflow: hidden;
      box-shadow: var(--fg-shadow);
      margin: 10px 0;
      touch-action: none;
      cursor: crosshair;
    }
    #canvas-iso {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── PALETA ── */
    .paleta {
      display: flex; gap: 8px; flex-wrap: wrap;
      align-items: center; margin: 10px 0;
    }
    .paleta-label {
      font-size: 12px; font-weight: 900;
      color: var(--fg-muted); margin-right: 4px;
    }
    .color-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer; transition: transform .12s, border-color .12s;
      flex-shrink: 0;
    }
    .color-btn:hover  { transform: scale(1.15); }
    .color-btn.active { border-color: #0f172a; transform: scale(1.2); }

    /* ── MODO Y ACCIONES ── */
    .ctrl-bar {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap; margin-top: 4px;
    }
    .modo-btn {
      padding: 10px 18px; border-radius: 99px;
      font-size: 13px; font-weight: 900;
      border: 2px solid var(--fg-stroke);
      background: var(--fg-card); cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .modo-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    .blq-counter {
      font-size: 13px; font-weight: 900; color: var(--fg-muted);
      margin-left: auto;
    }
    .blq-counter span { color: var(--fg-text); font-weight: 950; }

    /* ── MENSAJE ── */
    .const-msg {
      background: var(--fg-card); border-radius: 14px;
      padding: 10px 14px; font-size: 14px; font-weight: 800;
      color: var(--fg-text); box-shadow: var(--fg-shadow);
      margin: 8px 0; min-height: 42px;
      display: flex; align-items: center;
    }

    #contenedor-selector { min-height: 0; }

    /* ── PANTALLA FIN ── */
    .const-fin-img-wrap {
      text-align: center; margin: 16px 0;
    }
    #canvas-fin { border-radius: 14px; max-width: 100%; }
  </style>
</head>
<body>
<div class="fg-shell">

  <!-- ══ SELECTOR ══ -->
  <div id="pantalla-selector" class="screen active">
    <div id="contenedor-selector"></div>
  </div>

  <!-- ══ JUEGO ══ -->
  <div id="pantalla-juego" class="screen">
    <header class="fg-game-header">
      <a class="fg-btn-volver" href="../index.html">◀ Volver</a>
      <div class="fg-game-title">🏗️ Constructor</div>
      <div id="contenedor-sonido"></div>
    </header>

    <div class="fg-players-bar" id="players-bar"></div>
    <div class="fg-turn-banner"  id="turn-banner"></div>

    <!-- Lienzo isométrico -->
    <div id="canvas-wrap">
      <canvas id="canvas-iso"></canvas>
    </div>

    <!-- Paleta de colores -->
    <div class="paleta">
      <span class="paleta-label">Color:</span>
      <div id="paleta-btns"></div>
    </div>

    <!-- Controles -->
    <div class="ctrl-bar">
      <button class="modo-btn active" id="btn-colocar" onclick="setModo('colocar')">➕ Colocar</button>
      <button class="modo-btn"        id="btn-borrar"  onclick="setModo('borrar')">🗑️ Borrar</button>
      <div class="blq-counter">Bloques: <span id="blq-num">0</span></div>
    </div>

    <div class="const-msg" id="const-msg">¡Tocá el tablero para poner un bloque!</div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="fg-btn fg-btn-ghost" onclick="pasarTurno()" style="flex:1">
        ↩ Pasar turno
      </button>
      <button class="fg-btn fg-btn-primary" onclick="terminarConstruccion()" style="flex:1">
        🏆 Terminar
      </button>
    </div>
  </div>

  <!-- ══ FIN ══ -->
  <div id="pantalla-fin" class="screen">
    <header class="fg-game-header" style="margin-bottom:16px;">
      <a class="fg-btn-volver" href="../index.html">◀ Volver</a>
      <div class="fg-game-title">🏗️ ¡Listo!</div>
    </header>

    <div style="text-align:center; font-size:22px; font-weight:950; margin:8px 0;">
      ¡Construcción terminada!
    </div>
    <p style="text-align:center; color:var(--fg-muted); font-weight:700; margin-bottom:12px;">
      ¡La hicieron juntos!
    </p>

    <div class="const-fin-img-wrap">
      <canvas id="canvas-fin"></canvas>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="fg-btn fg-btn-primary" onclick="jugarDeNuevo()" style="flex:1">
        🔄 Construir de nuevo
      </button>
      <button class="fg-btn fg-btn-ghost" onclick="mostrarPantalla('pantalla-selector')" style="flex:1">
        👥 Cambiar jugadores
      </button>
    </div>
  </div>

</div>

<script src="../shared/storage.js"></script>
<script src="../shared/players.js"></script>
<script src="../shared/audio.js"></script>
<script>
/* ============================================================
   CONSTRUCTOR ISOMÉTRICO
   ============================================================ */

/* ── COLORES DISPONIBLES ── */
var PALETA = [
  '#ef4444',  // rojo
  '#3b82f6',  // azul
  '#22c55e',  // verde
  '#f59e0b',  // amarillo
  '#a855f7',  // violeta
  '#f97316',  // naranja
  '#fafafa',  // blanco
  '#1e293b',  // negro
];

/* ── DIMENSIONES ISOMÉTRICAS ── */
var IW  = 48;  // ancho de celda
var IH  = 24;  // alto de celda (perspectiva)
var BH  = 28;  // alto del cuerpo del bloque
var GRID_N = 7; // 7×7
var MAX_Z  = 5; // máximo 5 bloques en una celda

/* ── ESTADO ── */
var grilla   = [];  // grilla[gx][gy] = [color, ...]
var colorActual = PALETA[0];
var modo     = 'colocar';
var totalBloques = 0;
var canvas, ctx;
var originX, originY;
var DPR = 1;

/* ── INIT GRILLA ── */
function resetGrilla() {
  grilla = [];
  for (var i = 0; i < GRID_N; i++) {
    grilla.push([]);
    for (var j = 0; j < GRID_N; j++) grilla[i].push([]);
  }
  totalBloques = 0;
  actualizarContador();
}

/* ── PANTALLAS ── */
function mostrarPantalla(id) {
  document.querySelectorAll('.screen').forEach(function(s){
    s.classList.toggle('active', s.id === id);
  });
}

/* ── PROYECCIÓN ISOMÉTRICA ── */
function worldToScreen(gx, gy, gz) {
  return {
    x: originX + (gx - gy) * (IW / 2),
    y: originY + (gx + gy) * (IH / 2) - gz * BH
  };
}

/* ── HIT TEST: click (sx, sy) en celda (gx, gy) altura gz ── */
function inRhombus(px, py, cx, cy) {
  var dx = Math.abs(px - cx) / (IW / 2);
  var dy = Math.abs(py - cy) / (IH / 2);
  return dx + dy <= 1;
}

function hitTest(sx, sy) {
  /* En proyección isométrica, la celda clicada es aquella cuya cara superior
     contiene el punto. Iteramos en orden de pintura inverso (frente→atrás). */
  var hits = [];
  for (var gx = 0; gx < GRID_N; gx++) {
    for (var gy = 0; gy < GRID_N; gy++) {
      var stack = grilla[gx][gy];
      var topZ  = stack.length; // en esta celda el próximo z es stack.length
      /* Cara superior del tope de la pila (o del suelo si vacía) */
      var testZ = (modo === 'colocar') ? topZ : topZ - 1;
      if (modo === 'borrar' && testZ < 0) continue;
      var p = worldToScreen(gx, gy, testZ);
      var cy = p.y - IH / 2; /* centro de la cara superior */
      if (inRhombus(sx, sy, p.x, cy)) {
        hits.push({ gx: gx, gy: gy, z: testZ, sum: gx + gy, stackLen: stack.length });
      }
    }
  }
  if (hits.length === 0) return null;
  /* En caso de múltiples hits, el de mayor (gx+gy) está al frente */
  hits.sort(function(a, b) { return b.sum - a.sum || b.stackLen - a.stackLen; });
  return hits[0];
}

/* ── SHADING ── */
function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function shade(hex, f) {
  var c = hexToRgb(hex);
  var r = Math.min(255, Math.round(c[0]*f));
  var g = Math.min(255, Math.round(c[1]*f));
  var b = Math.min(255, Math.round(c[2]*f));
  return 'rgb('+r+','+g+','+b+')';
}

/* ── DIBUJAR UN BLOQUE ── */
function drawBlock(gx, gy, gz, color) {
  var p  = worldToScreen(gx, gy, gz);
  var hw = IW / 2, hh = IH / 2;

  /* Puntos de la cara superior (rombo) */
  var top    = { x: p.x,      y: p.y - hh - BH };
  var right  = { x: p.x + hw, y: p.y      - BH };
  var bottom = { x: p.x,      y: p.y + hh - BH };
  var left   = { x: p.x - hw, y: p.y      - BH };

  /* Cara izquierda */
  ctx.fillStyle = shade(color, 0.70);
  ctx.beginPath();
  ctx.moveTo(left.x,   left.y);
  ctx.lineTo(bottom.x, bottom.y);
  ctx.lineTo(bottom.x, bottom.y + BH);
  ctx.lineTo(left.x,   left.y   + BH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = .8; ctx.stroke();

  /* Cara derecha */
  ctx.fillStyle = shade(color, 0.85);
  ctx.beginPath();
  ctx.moveTo(bottom.x, bottom.y);
  ctx.lineTo(right.x,  right.y);
  ctx.lineTo(right.x,  right.y  + BH);
  ctx.lineTo(bottom.x, bottom.y + BH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke();

  /* Cara superior */
  ctx.fillStyle = shade(color, 1.15 > 1 ? 1 : 1.10);
  ctx.beginPath();
  ctx.moveTo(top.x,    top.y);
  ctx.lineTo(right.x,  right.y);
  ctx.lineTo(bottom.x, bottom.y);
  ctx.lineTo(left.x,   left.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke();
}

/* ── DIBUJAR SUELO ── */
function drawFloor(gx, gy) {
  var p  = worldToScreen(gx, gy, 0);
  var hw = IW / 2, hh = IH / 2;

  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath();
  ctx.moveTo(p.x,      p.y - hh);
  ctx.lineTo(p.x + hw, p.y);
  ctx.lineTo(p.x,      p.y + hh);
  ctx.lineTo(p.x - hw, p.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = .6; ctx.stroke();
}

/* ── RENDER COMPLETO ── */
function render(targetCtx, targetCanvas) {
  var c   = targetCtx   || ctx;
  var cvs = targetCanvas || canvas;
  c.clearRect(0, 0, cvs.width, cvs.height);

  /* Orden de pintura: back-to-front por (gx+gy), luego gx decreciente */
  var cells = [];
  for (var gx = 0; gx < GRID_N; gx++)
    for (var gy = 0; gy < GRID_N; gy++)
      cells.push([gx, gy]);
  cells.sort(function(a,b){ return (a[0]+a[1]) - (b[0]+b[1]) || a[0]-b[0]; });

  cells.forEach(function(c2) {
    var gx = c2[0], gy = c2[1];
    drawFloor(gx, gy);
    var stack = grilla[gx][gy];
    for (var z = 0; z < stack.length; z++) drawBlock(gx, gy, z, stack[z]);
  });
}

/* ── RESIZE ── */
function resizeCanvas() {
  var wrap = document.getElementById('canvas-wrap');
  var w    = wrap.clientWidth;
  var h    = Math.round(w * 0.65);
  DPR = window.devicePixelRatio || 1;
  canvas.width  = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(DPR, DPR);
  /* Origen: centro del tablero */
  originX = w / 2;
  originY = h * 0.58;
  render();
}

/* ── CLICK / TOUCH ── */
function handleClick(ex, ey) {
  var rect = canvas.getBoundingClientRect();
  var sx   = (ex - rect.left);
  var sy   = (ey - rect.top);
  var hit  = hitTest(sx, sy);
  if (!hit) return;

  var gx = hit.gx, gy = hit.gy;

  if (modo === 'colocar') {
    if (grilla[gx][gy].length >= MAX_Z) {
      setMsg('¡Esta celda ya está llena!');
      FamiliaAudio.error();
      return;
    }
    grilla[gx][gy].push(colorActual);
    totalBloques++;
    actualizarContador();
    FamiliaAudio.tap();
    render();
    /* Pasamos turno automáticamente */
    setTimeout(function() { pasarTurno(); }, 400);

  } else {
    /* Borrar */
    if (grilla[gx][gy].length === 0) return;
    grilla[gx][gy].pop();
    totalBloques = Math.max(0, totalBloques - 1);
    actualizarContador();
    FamiliaAudio.error();
    render();
  }
}

/* ── PASAR TURNO ── */
function pasarTurno() {
  var sig = FamiliaJugadores.siguiente();
  FamiliaJugadores.renderTurnBanner('turn-banner');
  FamiliaJugadores.renderChips('players-bar');
  setMsg('🎨 Turno de ' + sig.name + ' — ¡Elegí un color y tocá el tablero!');
  FamiliaAudio.anunciarTurno(sig.name);
}

/* ── MODO ── */
function setModo(m) {
  modo = m;
  document.getElementById('btn-colocar').classList.toggle('active', m === 'colocar');
  document.getElementById('btn-borrar').classList.toggle('active',  m === 'borrar');
}

/* ── COLOR ── */
function buildPaleta() {
  var cont = document.getElementById('paleta-btns');
  cont.style.display = 'flex'; cont.style.gap = '8px'; cont.style.flexWrap = 'wrap';
  PALETA.forEach(function(c, i) {
    var btn = document.createElement('button');
    btn.className = 'color-btn' + (i === 0 ? ' active' : '');
    btn.style.background = c;
    btn.style.boxShadow  = '0 2px 6px rgba(0,0,0,.25)';
    btn.setAttribute('aria-label', 'Color ' + c);
    btn.addEventListener('click', function() {
      colorActual = c;
      cont.querySelectorAll('.color-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      setModo('colocar');
    });
    cont.appendChild(btn);
  });
}

/* ── TERMINAR ── */
function terminarConstruccion() {
  /* Copiar canvas al canvas-fin */
  var finCanvas = document.getElementById('canvas-fin');
  var finW = Math.min(canvas.width / DPR, 420);
  var finH = Math.round(finW * (canvas.height / DPR) / (canvas.width / DPR));
  finCanvas.width  = finW * DPR;
  finCanvas.height = finH * DPR;
  finCanvas.style.width  = finW + 'px';
  finCanvas.style.height = finH + 'px';
  var finCtx = finCanvas.getContext('2d');
  finCtx.scale(DPR, DPR);

  /* Redibujar en tamaño del fin */
  var savedOriginX = originX, savedOriginY = originY;
  originX = finW / 2;
  originY = finH * 0.58;
  render(finCtx, finCanvas);
  originX = savedOriginX; originY = savedOriginY;

  FamiliaAudio.celebracion();
  FamiliaAudio.leer('¡Construcción terminada! ¡La hicieron juntos!');
  mostrarPantalla('pantalla-fin');
}

/* ── JUGAR DE NUEVO ── */
function jugarDeNuevo() {
  resetGrilla();
  render();
  setMsg('¡Construyan de nuevo! Turno de ' + FamiliaJugadores.actual().name);
  FamiliaJugadores.renderTurnBanner('turn-banner');
  FamiliaJugadores.renderChips('players-bar');
  mostrarPantalla('pantalla-juego');
}

/* ── HELPERS ── */
function setMsg(t) { document.getElementById('const-msg').textContent = t; }
function actualizarContador() {
  document.getElementById('blq-num').textContent = totalBloques;
}

/* ── INICIAR JUEGO ── */
function iniciarJuego() {
  FamiliaStorage.setUltimoJuego('constructor');
  resetGrilla();
  canvas  = document.getElementById('canvas-iso');
  ctx     = canvas.getContext('2d');
  buildPaleta();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  /* Mouse */
  canvas.addEventListener('click', function(e) {
    handleClick(e.clientX, e.clientY);
  });
  /* Touch */
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    handleClick(t.clientX, t.clientY);
  });

  FamiliaJugadores.renderTurnBanner('turn-banner');
  FamiliaJugadores.renderChips('players-bar');
  FamiliaAudio.renderBotonSonido('contenedor-sonido');
  setMsg('🎨 Turno de ' + FamiliaJugadores.actual().name + ' — ¡Elegí un color y tocá!');
  FamiliaAudio.anunciarTurno(FamiliaJugadores.actual().name);
  mostrarPantalla('pantalla-juego');
}

/* ── INIT ── */
FamiliaAudio.cargarPreferencia();
FamiliaJugadores.renderSelector('contenedor-selector', { min: 2, max: 4 }, function() {
  iniciarJuego();
});
</script>
</body>
</html>
