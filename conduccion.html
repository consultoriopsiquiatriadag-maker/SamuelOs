<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dc2626" />
  <title>Juegos de Conducción — Samuel OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100svh;
      padding-bottom: 32px;
    }

    /* ── HEADER ── */
    .header {
      background: #1e293b;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 2px solid #334155;
      position: sticky; top: 0; z-index: 10;
    }
    .btn-volver {
      background: #334155; color: #f1f5f9;
      border: none; border-radius: 12px;
      padding: 10px 16px; font-size: 15px; font-weight: 900;
      cursor: pointer; text-decoration: none;
      flex-shrink: 0;
    }
    .btn-volver:hover { background: #475569; }
    .header-titulo {
      font-size: 22px; font-weight: 950;
      display: flex; align-items: center; gap: 10px;
    }
    .header-sub {
      font-size: 13px; color: #94a3b8; font-weight: 700;
      margin-top: 2px;
    }

    /* ── AVISO ── */
    .aviso {
      background: #1e293b; border: 1.5px solid #334155;
      border-radius: 14px; padding: 12px 16px;
      margin: 16px 18px 0;
      font-size: 13px; color: #94a3b8; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .aviso-icon { font-size: 20px; flex-shrink: 0; }

    /* ── GRILLA ── */
    .seccion-titulo {
      font-size: 14px; font-weight: 900; color: #64748b;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 22px 18px 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding: 0 18px;
    }
    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    /* ── CARD ── */
    .card {
      background: #1e293b;
      border-radius: 18px;
      border: 2px solid #334155;
      overflow: hidden;
      cursor: pointer;
      transition: transform .13s, border-color .13s, box-shadow .13s;
      user-select: none;
      position: relative;
    }
    .card:hover  { transform: translateY(-4px); border-color: #dc2626; box-shadow: 0 16px 32px rgba(220,38,38,.25); }
    .card:active { transform: scale(.96); }

    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: #334155;
      object-fit: cover; display: block;
      font-size: 0; /* hide alt text */
    }
    .card-thumb-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, #334155, #1e293b);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }

    .card-body { padding: 10px 12px 12px; }
    .card-nombre {
      font-size: 13px; font-weight: 950; line-height: 1.25;
      color: #f1f5f9; margin-bottom: 4px;
    }
    .card-tag {
      display: inline-block; padding: 2px 8px;
      border-radius: 99px; font-size: 10px; font-weight: 900;
      background: #334155; color: #94a3b8;
    }
    .card-tag.top { background: #7c2d12; color: #fca5a5; }
    .card-tag.original { background: #1e3a5f; color: #93c5fd; }
    .card-tag.touch { background: #14532d; color: #86efac; }

    .card-play {
      position: absolute; inset: 0;
      background: rgba(220,38,38,.0);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s, background .15s;
    }
    .card:hover .card-play {
      opacity: 1;
      background: rgba(220,38,38,.18);
    }
    .card-play-icon {
      width: 52px; height: 52px; border-radius: 50%;
      background: #dc2626; display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 4px 20px rgba(220,38,38,.5);
    }

    /* ── GAME OVERLAY (iframe interno) ── */
    #game-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: #0f172a;
      flex-direction: column;
    }
    #game-overlay.show { display: flex; }
    #game-bar {
      background: #1e293b;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
      border-bottom: 2px solid #334155;
    }
    #btn-cerrar-juego {
      background: #ef4444; color: #fff; border: none;
      border-radius: 14px; padding: 14px 22px;
      font-size: 17px; font-weight: 900; cursor: pointer;
      flex-shrink: 0; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(239,68,68,.45);
    }
    #btn-cerrar-juego:active { transform: scale(.95); }
    #game-nombre {
      font-size: 15px; font-weight: 900; color: #f1f5f9;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #game-frame {
      flex: 1; border: none; width: 100%; height: 100%;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <a class="btn-volver" href="./juegos.html">◀ Juegos</a>
    <div>
      <div class="header-titulo">🚗 Conducción</div>
      <div class="header-sub">Tocá un juego para jugar</div>
    </div>
  </div>

  <!-- AVISO -->
  <div class="aviso">
    <span class="aviso-icon">🔒</span>
    <span>Tocá un juego — se abre aquí adentro. Usá el botón <strong>✕ Volver a Samuel</strong> para salir.</span>
  </div>

  <!-- JUEGOS TOP -->
  <div class="seccion-titulo">⭐ Los más populares</div>
  <div class="grid" id="grid-top"></div>

  <!-- JUEGOS PARA TOUCH/TABLET -->
  <div class="seccion-titulo">📱 Buenos para tablet</div>
  <div class="grid" id="grid-touch"></div>

  <!-- MÁS JUEGOS -->
  <div class="seccion-titulo">🎮 Más juegos</div>
  <div class="grid" id="grid-mas"></div>

  <!-- GAME OVERLAY -->
  <div id="game-overlay">
    <div id="game-bar">
      <button id="btn-cerrar-juego" onclick="cerrarJuego()">✕ Volver a Samuel</button>
      <div id="game-nombre"></div>
    </div>
    <iframe id="game-frame" src="" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </div>

<script>
/* ── CATÁLOGO DE JUEGOS ── */
var JUEGOS_TOP = [
  { nombre: 'Traffic Rider',       slug: 'traffic-rider-vvq',          tag: 'top',      emoji: '🏍️' },
  { nombre: 'Racing Limits',       slug: 'racing-limits',               tag: 'original', emoji: '🏎️' },
  { nombre: 'PolyTrack',           slug: 'polytrack',                   tag: 'top',      emoji: '🎯' },
  { nombre: 'Escape Road 3',       slug: 'escape-road-3',               tag: '',         emoji: '🚓' },
  { nombre: 'Real Car Driving',    slug: 'real-car-driving',            tag: '',         emoji: '🚗' },
  { nombre: 'Drift Hunters',       slug: 'drift-hunters',               tag: 'top',      emoji: '💨' },
  { nombre: 'Moto X3M',            slug: 'moto-x3m',                    tag: 'top',      emoji: '🏍️' },
  { nombre: 'Sky Riders',          slug: 'sky-riders-buk',              tag: 'original', emoji: '✈️' },
];

var JUEGOS_TOUCH = [
  { nombre: 'Ramp Car VS Police',  slug: 'ramp-car-vs-police-chase-psm',tag: 'touch',    emoji: '🚔' },
  { nombre: 'Hustle & Drift',      slug: 'hustle-drift-in-zil',         tag: 'touch',    emoji: '🌀' },
  { nombre: 'MX Offroad Master',   slug: 'mx-offroad-master',           tag: 'touch',    emoji: '🏍️' },
  { nombre: 'Moto X3M Pool Party', slug: 'moto-x3m-pool-party',         tag: 'touch',    emoji: '🌊' },
  { nombre: 'Moto X3M Winter',     slug: 'moto-x3m-4',                  tag: 'touch',    emoji: '❄️' },
  { nombre: 'Crazy Plane Landing', slug: 'crazy-plane-landing',         tag: 'touch',    emoji: '✈️' },
];

var JUEGOS_MAS = [
  { nombre: 'Demolition Derby 3',  slug: 'demolition-derby-3',          tag: 'original', emoji: '💥' },
  { nombre: 'Night City Racing',   slug: 'night-city-racing',           tag: '',         emoji: '🌃' },
  { nombre: 'Rally Racer Dirt',    slug: 'rally-racer-dirt',            tag: 'original', emoji: '🏁' },
  { nombre: 'Offroad Island',      slug: 'offroad-island',              tag: '',         emoji: '🏝️' },
  { nombre: 'Stunt Paradise',      slug: 'stunt-paradise',              tag: 'original', emoji: '🎪' },
  { nombre: 'Derby Crash 5',       slug: 'derby-crash-5',               tag: 'original', emoji: '🔥' },
  { nombre: 'Circuit Racing',      slug: 'circuit-racing',              tag: '',         emoji: '🏟️' },
  { nombre: 'Escape Road',         slug: 'escape-road-asm',             tag: '',         emoji: '🛣️' },
  { nombre: 'Monster Cars',        slug: 'monster-cars-ultimate-simulator',tag:'',       emoji: '🚛' },
  { nombre: 'Drive Quest',         slug: 'drive-quest---car-game',      tag: 'original', emoji: '🗺️' },
  { nombre: 'Ultimate Flying Car', slug: 'ultimate-flying-car',         tag: '',         emoji: '🚁' },
  { nombre: 'Traffic Racer',       slug: 'traffic-racer-sxc',           tag: 'original', emoji: '🛣️' },
];

var TAG_LABELS = { top: 'Popular', original: 'Original', touch: 'Tablet' };

/* ── URL del juego ── */
function urlJuego(slug) {
  return 'https://www.crazygames.com/es/game/' + slug;
}

/* ── URL de thumbnail (CrazyGames usa este patrón) ── */
function thumbUrl(slug) {
  return 'https://imgs.crazygames.com/' + slug + '_16x9?metadata=none&width=480&height=270&fit=crop&format=webp';
}

/* ── Abrir juego en iframe interno ── */
function abrirJuego(slug, nombre) {
  document.getElementById('game-frame').src = 'https://www.crazygames.com/embed/' + slug;
  document.getElementById('game-nombre').textContent = nombre || '';
  document.getElementById('game-overlay').classList.add('show');
}

function cerrarJuego() {
  document.getElementById('game-overlay').classList.remove('show');
  document.getElementById('game-frame').src = '';  /* detiene audio/video */
}

/* ── Construir card ── */
function crearCard(juego) {
  var card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', 'Jugar ' + juego.nombre);

  var tagHtml = juego.tag
    ? '<span class="card-tag ' + juego.tag + '">' + (TAG_LABELS[juego.tag] || juego.tag) + '</span>'
    : '';

  card.innerHTML =
    '<div class="card-thumb-placeholder" id="thumb-wrap-' + juego.slug + '">' +
      '<span>' + juego.emoji + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-nombre">' + juego.nombre + '</div>' +
      tagHtml +
    '</div>' +
    '<div class="card-play"><div class="card-play-icon">▶</div></div>';

  /* Intentar cargar thumbnail real */
  var img = new Image();
  img.onload = function() {
    var wrap = document.getElementById('thumb-wrap-' + juego.slug);
    if (wrap) {
      wrap.className = '';
      wrap.innerHTML = '';
      img.className = 'card-thumb';
      img.alt = juego.nombre;
      wrap.appendChild(img);
    }
  };
  img.src = thumbUrl(juego.slug);

  card.addEventListener('click',   function() { abrirJuego(juego.slug, juego.nombre); });
  card.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirJuego(juego.slug, juego.nombre); }
  });

  return card;
}

/* ── Poblar grillas ── */
function poblarGrid(idGrid, juegos) {
  var grid = document.getElementById(idGrid);
  juegos.forEach(function(j) { grid.appendChild(crearCard(j)); });
}

poblarGrid('grid-top',   JUEGOS_TOP);
poblarGrid('grid-touch', JUEGOS_TOUCH);
poblarGrid('grid-mas',   JUEGOS_MAS);
</script>
</body>
</html>
